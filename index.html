<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Norrona Cinema - Nordic Neon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------
   MS Norrona - Cinema signage, Nordic Neon
   Same palette and type as Kronborgs Widget: black panels, cyan to
   blue accents, Inter, letterspaced module headers.
   Modes:  (none)      full screen, centre left transparent for video
           ?rail=11    narrower panel, any width in vw (default 17)
           ?mode=rail  right panel only
           ?mode=bar   bottom bar only
           ?edit=1     editor
   --------------------------------------------------------------- */

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; width:100%; background:transparent; }
body {
  color:#f8fafc;
  font-family:'Inter', Arial, sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.stage { position:fixed; top:0; left:0; right:0; bottom:0; }

/* ---------- RIGHT PANEL ---------- */
.rail {
  position:absolute; top:0; right:0; bottom:0;
  width:17vw; min-width:220px;
  background:#000000;
  display:flex; flex-direction:column;
  padding:0 1.3vw 1.4vh 1.3vw;
  overflow:hidden;
}
.rail::before {
  content:""; position:absolute; top:6%; left:0; width:1px; height:88%;
  background:-webkit-linear-gradient(top, rgba(0,242,254,0), rgba(0,242,254,0.15), rgba(0,242,254,0));
  background:linear-gradient(180deg, rgba(0,242,254,0), rgba(0,242,254,0.15), rgba(0,242,254,0));
}

.module-header {
  text-align:center; font-size:1.05vh; font-weight:700; letter-spacing:.24em;
  color:#94a3b4; text-transform:uppercase; padding-top:1.7vh;
}
.module-header span { position:relative; display:inline-block; padding-bottom:.9vh; }
.module-header span::after {
  content:""; position:absolute; bottom:0; left:50%; width:16px; height:2px;
  margin-left:-8px; border-radius:2px; opacity:.9;
  background:-webkit-linear-gradient(left, #00f2fe, #4facfe);
  background:linear-gradient(90deg, #00f2fe, #4facfe);
}

.shows {
  flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column; justify-content:center;
}

.show { position:relative; padding:1.9vh .2vw; }
.show + .show::before {
  content:""; position:absolute; top:0; left:8%; width:84%; height:1px;
  background:-webkit-linear-gradient(left, rgba(0,242,254,0), rgba(0,242,254,0.18), rgba(0,242,254,0));
  background:linear-gradient(90deg, rgba(0,242,254,0), rgba(0,242,254,0.18), rgba(0,242,254,0));
}
.show .head { display:flex; align-items:center; }
.show .time { font-size:2.4vh; font-weight:600; color:#ffffff; line-height:1; letter-spacing:.02em; }
.show .title { font-size:1.7vh; font-weight:600; color:#ffffff; line-height:1.25; margin-top:.8vh; }
.show .note { font-size:1.25vh; color:#94a3b4; margin-top:.45vh; letter-spacing:.02em; }

.show.is-live .time { color:#ffffff; }
.show.is-live .note { color:#00f2fe; font-weight:600; }
.show.is-past { opacity:.34; }
.show.is-past .time { color:#94a3b4; }

.pin {
  width:6px; height:6px; border-radius:50%; margin-right:.5vw; flex:0 0 auto;
  background:#00f2fe; box-shadow:0 0 7px rgba(0,242,254,0.7);
}
.tag {
  margin-left:auto; white-space:nowrap;
  font-size:1.05vh; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:#cbd5e1; background:rgba(6,11,25,0.75);
  border:1px solid rgba(0,242,254,0.2); border-radius:20px;
  padding:.45vh .55vw;
}
.tag.live { color:#00f2fe; }
.tag.plain { background:transparent; border-color:transparent; color:#64748b; padding-right:0; }

.track {
  position:relative; width:100%; height:5px; border-radius:4px;
  background:rgba(255,255,255,0.10); margin-top:1.2vh;
}
.track-fill {
  position:relative; height:100%; border-radius:4px; width:0%;
  background:-webkit-linear-gradient(left, #00f2fe, #4facfe);
  background:linear-gradient(90deg, #00f2fe, #4facfe);
}
.track-dot {
  position:absolute; right:-3px; top:50%; margin-top:-4.5px;
  width:9px; height:9px; border-radius:50%; background:#00f2fe;
  box-shadow:0 0 0 2px #000000, 0 0 8px 1px #00f2fe;
}

.rail-foot { flex:0 0 auto; text-align:center; }
.clock { font-size:4vh; font-weight:300; color:#ffffff; letter-spacing:.05em; line-height:1; }
.clock-underline {
  width:46px; height:2px; margin:.9vh auto 0 auto;
  background:-webkit-linear-gradient(left, #00f2fe, #4facfe);
  background:linear-gradient(90deg, #00f2fe, #4facfe);
}
.clock-date {
  font-size:1.15vh; color:#94a3b4; margin-top:.8vh;
  text-transform:uppercase; letter-spacing:.12em;
}

/* ---------- BOTTOM BAR ---------- */
.footbar {
  position:absolute; left:0; bottom:0; right:17vw;
  height:11vh; min-height:70px;
  background:#000000;
  display:flex; align-items:stretch; justify-content:center;
}
.footbar::before {
  content:""; position:absolute; top:0; left:0; right:0; height:1px;
  background:-webkit-linear-gradient(left, rgba(0,242,254,0), rgba(0,242,254,0.25), rgba(0,242,254,0));
  background:linear-gradient(90deg, rgba(0,242,254,0), rgba(0,242,254,0.25), rgba(0,242,254,0));
}
.fmodule {
  position:relative; display:flex; flex-direction:column; justify-content:center;
  padding:0 2vw; text-align:center;
}
.fmodule::after {
  content:""; position:absolute; top:20%; right:0; width:1px; height:60%;
  background:-webkit-linear-gradient(top, rgba(0,242,254,0), rgba(0,242,254,0.15), rgba(0,242,254,0));
  background:linear-gradient(180deg, rgba(0,242,254,0), rgba(0,242,254,0.15), rgba(0,242,254,0));
}
.fmodule:last-child::after { display:none; }
.fmodule.cta { padding:0 2.6vw; }
.fhead {
  font-size:1vh; font-weight:700; letter-spacing:.24em; color:#94a3b4;
  text-transform:uppercase; margin-bottom:.9vh;
}
.price { font-size:2.6vh; font-weight:600; color:#ffffff; line-height:1; }
.price em { font-style:normal; font-size:1.3vh; color:#00f2fe; margin-left:.35vw; }
.finfo { font-size:1.55vh; font-weight:500; color:#cbd5e1; line-height:1.2; }
.message {
  font-size:1.8vh; font-weight:500; color:#ffffff; letter-spacing:.01em; line-height:1.2;
  opacity:1; -webkit-transition:opacity .45s; transition:opacity .45s;
}
.message b { color:#00f2fe; font-weight:600; }
.message.fade { opacity:0; }

/* ---------- MODES ---------- */
body.mode-rail .footbar { display:none; }
body.mode-rail .rail { width:100vw; min-width:0; }
body.mode-bar .rail { display:none; }
body.mode-bar .footbar { right:0; height:100vh; min-height:0; }
body.mode-bar .fhead { font-size:9vh; margin-bottom:7vh; }
body.mode-bar .price { font-size:26vh; }
body.mode-bar .price em { font-size:13vh; }
body.mode-bar .message { font-size:17vh; }
body.mode-bar .finfo { font-size:15vh; }
body.mode-bar .fmodule { padding:0 3.5vw; }

/* ---------- EDITOR ---------- */
.editor {
  display:none; position:fixed; top:0; left:0; right:0; bottom:0; overflow:auto;
  background:#0a0e17; color:#f8fafc; padding:28px;
}
body.mode-edit .editor { display:block; }
body.mode-edit .stage { display:none; }
.editor h1 { font-size:22px; font-weight:600; margin-bottom:4px; }
.editor p.lead { color:#94a3b4; margin-bottom:22px; font-size:14px; }
.editor h2 {
  font-size:10px; font-weight:700; letter-spacing:.24em; text-transform:uppercase;
  color:#00f2fe; margin:26px 0 10px 0;
}
.editor label { display:block; font-size:11px; color:#94a3b4; margin-bottom:5px; letter-spacing:.04em; }
.editor input, .editor textarea {
  background:#06111f; border:1px solid rgba(0,242,254,0.2); color:#f8fafc;
  padding:9px 10px; border-radius:6px; font-family:inherit; font-size:14px; width:100%;
}
.editor input:focus, .editor textarea:focus { outline:2px solid #00f2fe; outline-offset:1px; }
.row { display:flex; margin-bottom:10px; align-items:flex-end; }
.row .c { flex:1 1 auto; padding-right:10px; }
.row .c.w-time { flex:0 0 90px; }
.row .c.w-dur { flex:0 0 96px; }
.row .c.w-price { flex:0 0 170px; }
.btn {
  background:#00f2fe; color:#06111f; border:none; padding:10px 16px; border-radius:6px;
  font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;
}
.btn.ghost { background:transparent; color:#f8fafc; border:1px solid rgba(0,242,254,0.35); }
.btn.tiny { padding:8px 10px; font-size:13px; }
.actions { margin-top:22px; }
.actions .btn { margin-right:10px; }
.out { margin-top:18px; }
.out textarea { height:220px; font-family:Consolas,Menlo,monospace; font-size:12px; }
template { display:none; }
@media (max-width:700px){ .row { flex-wrap:wrap; } .row .c { flex:1 1 100%; } }
</style>
</head>
<body>

<!-- =========================================================
     PROGRAMME DATA - edit here, or use ?edit=1
     ========================================================= -->
<script type="application/json" id="cinema-data">
{

<div class="stage">
  <aside class="rail">
    <div class="module-header"><span id="uiHeading"></span></div>
    <div class="shows" id="uiShows"></div>
    <div class="module-header"><span id="uiTimeHeading"></span></div>
    <div class="rail-foot">
      <div class="clock" id="uiClock">00:00</div>
      <div class="clock-underline"></div>
      <div class="clock-date" id="uiDate">-- --- ----</div>
    </div>
  </aside>

  <div class="footbar" id="uiFootbar"></div>
</div>

<!-- =========================== EDITOR =========================== -->
<div class="editor">
  <h1>Cinema programme</h1>
  <p class="lead">Edit the texts, press <b>Save file</b> and upload cinema.json where the screen reads it from.</p>

  <h2>Headings</h2>
  <div class="row">
    <div class="c"><label>Panel heading</label><input id="edHeading"></div>
    <div class="c w-price"><label>Bottom bar heading</label><input id="edVenue"></div>
    <div class="c w-price"><label>Clock heading</label><input id="edTimeHeading"></div>
  </div>

  <h2>Screenings</h2>
  <div id="edShows"></div>
  <button class="btn ghost tiny" id="edAddShow">Add screening</button>

  <h2>Ticket prices</h2>
  <div id="edPrices"></div>
  <button class="btn ghost tiny" id="edAddPrice">Add price</button>

  <h2>Doors</h2>
  <div class="row">
    <div class="c w-price"><label>Label</label><input id="edDoorsHead" placeholder="Doors"></div>
    <div class="c"><label>Text - a line break here becomes a line break on screen</label><textarea id="edDoorsText" rows="2"></textarea></div>
  </div>

  <h2>Ticket message - leave an empty line between each language, rotates every 12 seconds</h2>
  <div class="c"><textarea id="edMessages" rows="6"></textarea></div>

  <div class="actions">
    <button class="btn" id="edSave">Save file</button>
    <button class="btn ghost" id="edCopy">Copy JSON</button>
    <button class="btn ghost" id="edPreview">Preview screen</button>
  </div>
  <div class="out"><label>JSON</label><textarea id="edOut" readonly></textarea></div>
</div>

<template id="tplShow">
  <div class="row js-show">
    <div class="c w-time"><label>Time</label><input class="js-time" placeholder="09:00"></div>
    <div class="c"><label>Film</label><input class="js-title"></div>
    <div class="c"><label>Note</label><input class="js-note" placeholder="English audio"></div>
    <div class="c w-dur"><label>Minutes</label><input class="js-dur" placeholder="95"></div>
    <div class="c w-dur"><button class="btn ghost tiny js-del">Remove</button></div>
  </div>
</template>

<template id="tplPrice">
  <div class="row js-price">
    <div class="c w-price"><label>Label</label><input class="js-head" placeholder="Adult"></div>
    <div class="c w-time"><label>Price</label><input class="js-value" placeholder="89"></div>
    <div class="c w-time"><label>Currency</label><input class="js-unit" placeholder="DKK"></div>
    <div class="c w-dur"><button class="btn ghost tiny js-del">Remove</button></div>
  </div>
</template>

<script>
/* ES5 only, pure ASCII source. All display text comes from the JSON block. */
(function () {
  'use strict';

  /* Point this at a JSON file to update the screen without touching the CMS,
     e.g. "https://kronborg1980.github.io/signage/cinema.json" */
  var REMOTE_URL = '';
  var REMOTE_REFRESH_MS = 300000;
  var TICK_MS = 10000;
  var MESSAGE_MS = 12000;

  var data = null;
  var msgIndex = 0;

  function $(id) { return document.getElementById(id); }
  function q(el, sel) { return el.querySelector(sel); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function txt(node, s) {
    while (node.firstChild) { node.removeChild(node.firstChild); }
    node.appendChild(document.createTextNode(s == null ? '' : s));
  }
  function el(tag, cls) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    return n;
  }

  function readLocal() {
    var node = $('cinema-data');
    try { return JSON.parse(node.textContent || node.innerText); }
    catch (e) { return { heading: 'Cinema', prices: [], messages: [], shows: [] }; }
  }
  function cacheGet() {
    try { var raw = window.localStorage.getItem('norrona-cinema'); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function cacheSet(o) {
    try { window.localStorage.setItem('norrona-cinema', JSON.stringify(o)); } catch (e) {}
  }

  function loadRemote(cb) {
    if (!REMOTE_URL) { cb(null); return; }
    var url = REMOTE_URL + (REMOTE_URL.indexOf('?') > -1 ? '&' : '?') + '_=' + (new Date()).getTime();
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    if ('timeout' in xhr) { xhr.timeout = 15000; }
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) { return; }
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var o = JSON.parse(xhr.responseText);
          if (o && o.shows) { cacheSet(o); cb(o); return; }
        } catch (e) {}
      }
      cb(null);
    };
    xhr.ontimeout = function () { cb(null); };
    xhr.onerror = function () { cb(null); };
    try { xhr.send(); } catch (e) { cb(null); }
  }

  function minutesOf(hhmm) {
    if (!hhmm) { return -1; }
    var p = ('' + hhmm).split(':');
    var h = parseInt(p[0], 10), m = parseInt(p[1], 10);
    if (isNaN(h)) { return -1; }
    if (isNaN(m)) { m = 0; }
    return h * 60 + m;
  }
  function nowMinutes() {
    var d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }
  function clockOf(mins) {
    var m = ((mins % 1440) + 1440) % 1440;
    return pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  }
  function label(key) {
    var l = data.labels || {};
    if (key === 'now') { return l.now || 'Now showing'; }
    if (key === 'done') { return l.done || 'Ended'; }
    if (key === 'inMin') { return l.inMin || 'In %m min'; }
    if (key === 'next') { return l.next || 'Next'; }
    if (key === 'ends') { return l.ends || 'Ends %t'; }
    return '';
  }
  function durOf(s) {
    var d = parseInt(s.dur, 10);
    return (isNaN(d) || d <= 0) ? 100 : d;
  }
  function hasLive(shows, now) {
    for (var i = 0; i < shows.length; i++) {
      var st = minutesOf(shows[i].time);
      if (st <= now && now < st + durOf(shows[i])) { return true; }
    }
    return false;
  }

  function renderShows() {
    var host = $('uiShows');
    while (host.firstChild) { host.removeChild(host.firstChild); }

    var shows = data.shows || [];
    var now = nowMinutes();
    var live = hasLive(shows, now);
    var i, s, start, end, nextIdx = -1;

    for (i = 0; i < shows.length; i++) {
      if (minutesOf(shows[i].time) > now && nextIdx === -1) { nextIdx = i; }
    }

    for (i = 0; i < shows.length; i++) {
      s = shows[i];
      start = minutesOf(s.time);
      end = start + durOf(s);
      var isLive = start <= now && now < end;
      var isPast = now >= end;
      var isNext = (i === nextIdx);

      var row = el('div', 'show' + (isLive ? ' is-live' : '') + (isPast ? ' is-past' : ''));

      var head = el('div', 'head');
      if (isLive || (isNext && !live)) { head.appendChild(el('span', 'pin')); }

      var t = el('div', 'time');
      txt(t, s.time || '');
      head.appendChild(t);

      var tag = null;
      if (isLive) {
        tag = el('span', 'tag live');
        txt(tag, label('now'));
      } else if (isNext) {
        var mins = start - now;
        tag = el('span', 'tag');
        txt(tag, mins <= 120 ? label('inMin').replace('%m', '' + mins) : label('next'));
      } else if (isPast) {
        tag = el('span', 'tag plain');
        txt(tag, label('done'));
      }
      if (tag) { head.appendChild(tag); }
      row.appendChild(head);

      var ti = el('div', 'title');
      txt(ti, s.title || '');
      row.appendChild(ti);

      var note = s.note || '';
      if (isLive) {
        note = label('ends').replace('%t', clockOf(end)) + (note ? '  ' + String.fromCharCode(183) + '  ' + note : '');
      } else if (note) {
        note = note + '  ' + String.fromCharCode(183) + '  ' + durOf(s) + ' min';
      }
      if (note) {
        var n = el('div', 'note');
        txt(n, note);
        row.appendChild(n);
      }

      if (isLive) {
        var track = el('div', 'track');
        var fill = el('div', 'track-fill');
        var pct = Math.round(((now - start) / durOf(s)) * 100);
        if (pct < 2) { pct = 2; }
        if (pct > 100) { pct = 100; }
        fill.style.width = pct + '%';
        fill.appendChild(el('span', 'track-dot'));
        track.appendChild(fill);
        row.appendChild(track);
      }

      host.appendChild(row);
    }
  }

  /* Line breaks in the data become real breaks, so a two-line message stays
     two lines instead of wrapping wherever the panel happens to end. */
  function lines(node, s) {
    while (node.firstChild) { node.removeChild(node.firstChild); }
    var parts = ('' + (s || '')).split('\n');
    for (var i = 0; i < parts.length; i++) {
      if (i) { node.appendChild(document.createElement('br')); }
      node.appendChild(document.createTextNode(parts[i]));
    }
  }

  function addModule(host, headText, bodyNode, cls) {
    var mod = el('div', cls ? 'fmodule ' + cls : 'fmodule');
    var h = el('div', 'fhead');
    txt(h, headText || '');
    mod.appendChild(h);
    mod.appendChild(bodyNode);
    host.appendChild(mod);
    return mod;
  }

  function renderFootbar() {
    var host = $('uiFootbar');
    while (host.firstChild) { host.removeChild(host.firstChild); }

    var prices = data.prices || [];
    var i, v, u;
    for (i = 0; i < prices.length; i++) {
      v = el('div', 'price');
      txt(v, prices[i].value || '');
      if (prices[i].unit) {
        u = el('em');
        txt(u, prices[i].unit);
        v.appendChild(u);
      }
      addModule(host, prices[i].head, v);
    }

    var info = data.info || [];
    for (i = 0; i < info.length; i++) {
      var t = el('div', 'finfo');
      lines(t, info[i].text);
      addModule(host, info[i].head, t);
    }

    var msg = el('div', 'message');
    msg.id = 'uiMessage';
    addModule(host, data.ticketsHeading, msg, 'cta');
  }

  function renderHead() {
    txt($('uiHeading'), data.heading || '');
    txt($('uiTimeHeading'), data.timeHeading || '');
  }

  function renderClock() {
    var d = new Date();
    txt($('uiClock'), pad(d.getHours()) + ':' + pad(d.getMinutes()));
    var days = data.days, months = data.months;
    if (days && months) {
      txt($('uiDate'), days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()] +
        (data.venue ? '  ' + String.fromCharCode(183) + '  ' + data.venue : ''));
    } else {
      txt($('uiDate'), data.venue || '');
    }
  }

  function showMessage(node) {
    var list = data.messages || [];
    if (!node || !list.length) { return; }
    lines(node, list[((msgIndex - 1) % list.length + list.length) % list.length]);
  }

  function rotateMessage() {
    var list = data.messages || [];
    var node = $('uiMessage');
    if (!node) { return; }
    if (!list.length) { txt(node, ''); return; }
    node.className = 'message fade';
    window.setTimeout(function () {
      lines(node, list[msgIndex % list.length]);
      msgIndex++;
      node.className = 'message';
    }, 450);
  }

  function renderAll() {
    renderHead();
    renderShows();
    renderFootbar();
    showMessage($('uiMessage'));
    renderClock();
  }

  function param(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }

  /* The panel width drives how much room the trailer gets, so it is tunable
     from the booking URL: ?rail=11 gives a 16:9 window on a 1920x1080 screen
     with the bar at its current height. */
  function setRailWidth(vw) {
    var n = parseFloat(vw);
    if (isNaN(n) || n < 5 || n > 45) { return; }
    var rail = document.getElementsByClassName('rail')[0];
    var bar = $('uiFootbar');
    if (rail) { rail.style.width = n + 'vw'; }
    if (bar) { bar.style.right = n + 'vw'; }
  }

  /* ---------------- editor ---------------- */

  function addRow(tplId, hostId, cls, fill) {
    var tpl = $(tplId);
    if (!tpl.content) { return; }
    var host = $(hostId);
    host.appendChild(tpl.content.cloneNode(true));
    var rows = host.getElementsByClassName(cls);
    var row = rows[rows.length - 1];
    if (fill) { fill(row); }
    q(row, '.js-del').onclick = function () { row.parentNode.removeChild(row); buildJson(); };
  }

  function addShowRow(s) {
    addRow('tplShow', 'edShows', 'js-show', function (row) {
      if (!s) { return; }
      q(row, '.js-time').value = s.time || '';
      q(row, '.js-title').value = s.title || '';
      q(row, '.js-note').value = s.note || '';
      q(row, '.js-dur').value = s.dur || '';
    });
  }
  function addPriceRow(p) {
    addRow('tplPrice', 'edPrices', 'js-price', function (row) {
      if (!p) { return; }
      q(row, '.js-head').value = p.head || '';
      q(row, '.js-value').value = p.value || '';
      q(row, '.js-unit').value = p.unit || '';
    });
  }

  function collect() {
    var out = {
      heading: $('edHeading').value,
      venue: data.venue,
      ticketsHeading: $('edVenue').value,
      timeHeading: $('edTimeHeading').value,
      labels: data.labels,
      days: data.days,
      months: data.months,
      prices: [],
      messages: [],
      shows: []
    };
    var rows = $('edShows').getElementsByClassName('js-show');
    var i;
    for (i = 0; i < rows.length; i++) {
      var t = q(rows[i], '.js-time').value;
      var ti = q(rows[i], '.js-title').value;
      if (!t && !ti) { continue; }
      out.shows.push({
        time: t, title: ti,
        note: q(rows[i], '.js-note').value,
        dur: parseInt(q(rows[i], '.js-dur').value, 10) || 100
      });
    }
    var pr = $('edPrices').getElementsByClassName('js-price');
    for (i = 0; i < pr.length; i++) {
      var v = q(pr[i], '.js-value').value;
      if (!v) { continue; }
      out.prices.push({
        head: q(pr[i], '.js-head').value,
        value: v,
        unit: q(pr[i], '.js-unit').value
      });
    }
    var doorsText = $('edDoorsText').value.replace(/^\s+|\s+$/g, '');
    if (doorsText) {
      out.info = [{ head: $('edDoorsHead').value, text: doorsText }];
    }

    var blocks = $('edMessages').value.split(/\n\s*\n/);
    for (i = 0; i < blocks.length; i++) {
      var block = blocks[i].replace(/^\s+|\s+$/g, '');
      if (block) { out.messages.push(block); }
    }
    return out;
  }

  function buildJson() { $('edOut').value = JSON.stringify(collect(), null, 2); }

  function startEditor() {
    document.body.className = 'mode-edit';
    $('edHeading').value = data.heading || '';
    $('edVenue').value = data.ticketsHeading || '';
    $('edTimeHeading').value = data.timeHeading || '';
    $('edMessages').value = (data.messages || []).join('\n\n');
    var doors = (data.info && data.info[0]) ? data.info[0] : null;
    $('edDoorsHead').value = doors ? (doors.head || '') : 'Doors';
    $('edDoorsText').value = doors ? (doors.text || '') : '';
    var i;
    for (i = 0; i < (data.shows || []).length; i++) { addShowRow(data.shows[i]); }
    for (i = 0; i < (data.prices || []).length; i++) { addPriceRow(data.prices[i]); }
    buildJson();

    $('edAddShow').onclick = function () { addShowRow(null); buildJson(); };
    $('edAddPrice').onclick = function () { addPriceRow(null); buildJson(); };
    $('edSave').onclick = function () {
      buildJson();
      var blob = new Blob([$('edOut').value], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'cinema.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };
    $('edCopy').onclick = function () {
      buildJson();
      $('edOut').select();
      try { document.execCommand('copy'); } catch (e) {}
    };
    $('edPreview').onclick = function () {
      data = collect();
      document.body.className = '';
      renderAll();
      rotateMessage();
    };
    var ed = document.getElementsByClassName('editor')[0];
    ed.onkeyup = buildJson;
    ed.onchange = buildJson;
  }

  /* ---------------- start ---------------- */

  function boot() {
    var mode = param('mode');
    if (mode === 'rail' || mode === 'bar') { document.body.className = 'mode-' + mode; }
    setRailWidth(param('rail'));

    data = cacheGet() || readLocal();
    renderAll();
    rotateMessage();

    if (param('edit')) { startEditor(); return; }

    loadRemote(function (o) { if (o) { data = o; renderAll(); } });

    window.setInterval(function () { renderShows(); renderClock(); }, TICK_MS);
    window.setInterval(rotateMessage, MESSAGE_MS);
    window.setInterval(function () {
      loadRemote(function (o) { if (o) { data = o; renderAll(); } });
    }, REMOTE_REFRESH_MS);
    window.setInterval(function () {
      var d = new Date();
      if (d.getHours() === 3 && d.getMinutes() === 0) { window.location.reload(); }
    }, 60000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, false);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
